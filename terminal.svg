<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 240" width="100%" height="100%">
  <defs>
    <!-- Fonts & Keyframe Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 16px; }
      .header-bg { fill: #161b22; }
      .header-border { stroke: #30363d; stroke-width: 1px; }
      
      .title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: #8b949e;
        font-weight: 500;
        text-anchor: middle;
      }
      .title .user { fill: #58a6ff; font-weight: 700; }
      .title .cmd { fill: #c9d1d9; }

      .prompt-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 500;
        text-anchor: middle;
      }
      .prompt-user { fill: #58a6ff; font-weight: 700; }
      .prompt-cmd { fill: #c9d1d9; }

      .ascii-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        font-weight: 700;
        white-space: pre;
        text-anchor: middle;
      }
      .abhi-glow {
        fill: #58a6ff;
        filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.6));
      }
      .sharma-glow {
        fill: #bc8cff;
        filter: drop-shadow(0 0 6px rgba(188, 140, 255, 0.6));
      }
      .beam-glow {
        fill: #ffbd2e;
        filter: drop-shadow(0 0 8px #ffbd2e);
      }
      .subtitle-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #c9d1d9;
        letter-spacing: 0.5px;
        text-anchor: middle;
      }

      /* Left-to-right typing reveal animation */
      .typing-mask {
        animation: type-reveal 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes type-reveal {
        0% { width: 0px; }
        100% { width: 1348px; }
      }

      /* Cursor Animation */
      .cursor {
        fill: #3fb950;
        animation: cursor-blink 0.9s step-end infinite, cursor-fade 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        filter: drop-shadow(0 0 6px #3fb950);
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes cursor-fade {
        0% { opacity: 0; }
        95% { opacity: 0; }
        100% { opacity: 1; }
      }

      .scanline-overlay {
        fill: url(#scanline-pattern);
        opacity: 0.25;
        pointer-events: none;
      }

      .ambient-glow {
        fill: url(#glow-gradient);
        opacity: 0.14;
        filter: blur(20px);
      }
    </style>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="60%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanline-pattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" />
    </pattern>

    <!-- Clip Path for Typewriter Animation -->
    <clipPath id="typing-clip">
      <rect class="typing-mask" x="1" y="42" width="0" height="198" />
    </clipPath>
  </defs>

  <!-- Outer Window Background & Border -->
  <rect class="bg" x="1" y="1" width="1348" height="238" />

  <!-- Soft Ambient Glow -->
  <rect class="ambient-glow" x="100" y="50" width="1150" height="140" />

  <!-- CRT Scanlines -->
  <rect class="scanline-overlay" x="2" y="2" width="1346" height="236" rx="15" />

  <!-- Top Bar -->
  <path class="header-bg" d="M 1,17 C 1,8 8,1 17,1 L 1333,1 C 1342,1 1349,8 1349,17 L 1349,42 L 1,42 Z" />
  <line class="header-border" x1="1" y1="42" x2="1349" y2="42" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text class="title" x="675" y="26">
    <tspan class="user">sharmaa-abhi@github</tspan>: ~$ <tspan class="cmd">./wordmark.sh --name</tspan>
  </text>

  <!-- Prompt Command Line (centered) -->
  <text class="prompt-text" x="675" y="70">
    <tspan class="prompt-user">sharmaa-abhi@github: ~$</tspan>
    <tspan class="prompt-cmd"> ./wordmark.sh --name</tspan>
  </text>

  <!-- ASCII Banner Content with Typewriter Mask (centered) -->
  <g clip-path="url(#typing-clip)">
    <text class="ascii-text" x="675" y="100"><tspan class="abhi-glow"> █████╗ ██████╗ ██╗  ██╗██╗███████╗██╗  ██╗███████╗██╗  ██╗</tspan>     <tspan class="beam-glow">⚡</tspan>     <tspan class="sharma-glow">███████╗██╗  ██╗██████╗ ███╗   ███╗██████╗  █████╗  █████╗ </tspan></text>
    <text class="ascii-text" x="675" y="116"><tspan class="abhi-glow">██╔══██╗██╔══██╗██║  ██║██║██╔════╝██║  ██║██╔════╝██║  ██║</tspan>     <tspan class="beam-glow">┆</tspan>     <tspan class="sharma-glow">██╔════╝██║  ██║██╔══██╗████╗ ████║██╔══██╗██╔══██╗██╔══██╗</tspan></text>
    <text class="ascii-text" x="675" y="132"><tspan class="abhi-glow">███████║██████╔╝███████║██║███████╗███████║█████╗  ███████║</tspan>     <tspan class="beam-glow">✦</tspan>     <tspan class="sharma-glow">███████╗███████║██████╔╝██╔████╔██║███████║███████║███████║</tspan></text>
    <text class="ascii-text" x="675" y="148"><tspan class="abhi-glow">██╔══██║██╔══██╗██╔══██║██║╚════██║██╔══██║██╔══╝  ██╔══██║</tspan>     <tspan class="beam-glow">┆</tspan>     <tspan class="sharma-glow">╚════██║██╔══██║██╔══██╗██║╚██╔╝██║██╔══██║██╔══██║██╔══██║</tspan></text>
    <text class="ascii-text" x="675" y="164"><tspan class="abhi-glow">██║  ██║██████╔╝██║  ██║██║███████║██║  ██║███████╗██║  ██║</tspan>     <tspan class="beam-glow">⚡</tspan>     <tspan class="sharma-glow">██████║██║  ██║██║  ██║██║ ╚═╝ ██║██║  ██║██║  ██║██║  ██║</tspan></text>
    <text class="ascii-text" x="675" y="180"><tspan class="abhi-glow">╚═╝  ╚═╝╚═════╝ ╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</tspan>     <tspan class="beam-glow">┆</tspan>     <tspan class="sharma-glow">╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝</tspan></text>

    <!-- Subtitle Badge line in SVG -->
    <text class="subtitle-txt" x="675" y="210"><tspan fill="#ffbd2e">✦</tspan> <tspan fill="#58a6ff" font-weight="700">A B H I S H E K &#160;&#160; S H A R M A A</tspan> <tspan fill="#8b949e">• Full-Stack Engineer &amp; Open Source Developer</tspan></text>
  </g>

  <!-- Animated Blinking Cursor at the end (centered below text) -->
  <rect class="cursor" x="671" y="196" width="9" height="16" rx="1" />
</svg>
