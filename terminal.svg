<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Fonts & Keyframe Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 16px; }
      .header-bg { fill: #161b22; }
      .header-border { stroke: #30363d; stroke-width: 1px; }
      
      .title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: #8b949e;
        font-weight: 500;
        text-anchor: middle;
      }
      .title .user { fill: #58a6ff; font-weight: 700; }
      .title .cmd { fill: #7ee787; }

      .prompt-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 500;
      }
      .prompt-user { fill: #bc8cff; font-weight: 700; }
      .prompt-sym { fill: #3fb950; font-weight: 700; }
      .prompt-cmd { fill: #c9d1d9; }

      .ascii-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: -0.5px;
        white-space: pre;
        fill: url(#ascii-gradient);
        filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.4));
      }

      /* Left-to-right typing reveal animation */
      .typing-mask {
        animation: type-reveal 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes type-reveal {
        0% { width: 0px; }
        100% { width: 850px; }
      }

      /* Cursor Animation */
      .cursor {
        fill: #3fb950;
        animation: cursor-blink 0.9s step-end infinite, cursor-move 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        filter: drop-shadow(0 0 6px #3fb950);
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes cursor-move {
        0% { x: 30px; }
        100% { x: 840px; }
      }

      .scanline-overlay {
        fill: url(#scanline-pattern);
        opacity: 0.35;
        pointer-events: none;
      }

      .ambient-glow {
        fill: url(#glow-gradient);
        opacity: 0.15;
        filter: blur(20px);
      }
    </style>

    <!-- Linear Gradient for Text -->
    <linearGradient id="ascii-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="35%" stop-color="#39c5bb" />
      <stop offset="70%" stop-color="#7ee787" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="60%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanline-pattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" />
    </pattern>

    <!-- Clip Path for Typewriter Animation -->
    <clipPath id="typing-clip">
      <rect class="typing-mask" x="30" y="80" width="0" height="180" />
    </clipPath>
  </defs>

  <!-- Outer Window Background & Border -->
  <rect class="bg" x="1" y="1" width="898" height="278" />

  <!-- Soft Ambient Glow -->
  <rect class="ambient-glow" x="100" y="50" width="700" height="180" />

  <!-- CRT Scanlines -->
  <rect class="scanline-overlay" x="2" y="2" width="896" height="276" rx="15" />

  <!-- Top Bar -->
  <path class="header-bg" d="M 1,17 C 1,8 8,1 17,1 L 883,1 C 892,1 899,8 899,17 L 899,42 L 1,42 Z" />
  <line class="header-border" x1="1" y1="42" x2="899" y2="42" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text class="title" x="450" y="26">
    <tspan class="user">sharmaa-abhi@github</tspan> ~ $ <tspan class="cmd">./whoami</tspan>
  </text>

  <!-- Prompt Command Line -->
  <text class="prompt-text" x="30" y="70">
    <tspan class="prompt-user">sharmaa-abhi@github ~ $</tspan>
    <tspan class="prompt-sym"> ❯ </tspan>
    <tspan class="prompt-cmd">./whoami</tspan>
  </text>

  <!-- ASCII Banner Content with Typewriter Mask -->
  <g clip-path="url(#typing-clip)">
    <text class="ascii-text" x="30" y="98"> █████╗ ██████╗ ██╗  ██╗██╗███████╗██╗  ██╗███████╗██╗  ██╗   ███████╗██╗  ██╗ █████╗ ██████╗ ███╗   ███╗ █████╗ </text>
    <text class="ascii-text" x="30" y="112">██╔══██╗██╔══██╗██║  ██║██║██╔════╝██║  ██║██╔════╝██║ ██╔╝   ██╔════╝██║  ██║██╔══██╗██╔══██╗████╗ ████║██╔══██╗</text>
    <text class="ascii-text" x="30" y="126">███████║██████╔╝███████║██║███████╗███████║█████╗  █████═╝    ███████╗███████║███████║██████╔╝██╔████╔██║███████║</text>
    <text class="ascii-text" x="30" y="140">██╔══██║██╔══██╗██╔══██║██║╚════██║██╔══██║██╔══╝  ██╔═██╗    ╚════██║██╔══██║██╔══██║██╔══██╗██║╚██╔╝██║██╔══██║</text>
    <text class="ascii-text" x="30" y="154">██║  ██║██████╔╝██║  ██║██║███████║██║  ██║███████╗██║  ██╗   ███████║██║  ██║██║  ██║██║  ██║██║ ╚═╝ ██║██║  ██║</text>
    <text class="ascii-text" x="30" y="168">╚═╝  ╚═╝╚═════╝ ╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝   ╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝</text>
  </g>

  <!-- Animated Blinking Cursor at the end -->
  <rect class="cursor" x="840" y="157" width="10" height="15" rx="1" />
</svg>
