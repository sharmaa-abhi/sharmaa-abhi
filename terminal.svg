<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="100%">
  <defs>
    <!-- Fonts & Keyframe Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 16px; }
      .header-bg { fill: #161b22; }
      .header-border { stroke: #30363d; stroke-width: 1px; }
      
      .title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: #8b949e;
        font-weight: 500;
        text-anchor: middle;
      }
      .title .user { fill: #58a6ff; font-weight: 700; }
      .title .cmd { fill: #c9d1d9; }

      .prompt-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 500;
      }
      .prompt-user { fill: #58a6ff; font-weight: 700; }
      .prompt-cmd { fill: #c9d1d9; }

      .ascii-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7.2px;
        font-weight: 700;
        letter-spacing: -0.2px;
        white-space: pre;
        fill: #c9d1d9;
        filter: drop-shadow(0 0 4px rgba(201, 209, 217, 0.25));
      }

      /* Left-to-right typing reveal animation */
      .typing-mask {
        animation: type-reveal 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes type-reveal {
        0% { width: 0px; }
        100% { width: 950px; }
      }

      /* Cursor Animation */
      .cursor {
        fill: #3fb950;
        animation: cursor-blink 0.9s step-end infinite, cursor-move 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        filter: drop-shadow(0 0 6px #3fb950);
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes cursor-move {
        0% { x: 26px; }
        100% { x: 945px; }
      }

      .scanline-overlay {
        fill: url(#scanline-pattern);
        opacity: 0.3;
        pointer-events: none;
      }

      .ambient-glow {
        fill: url(#glow-gradient);
        opacity: 0.12;
        filter: blur(20px);
      }
    </style>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="60%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanline-pattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" />
    </pattern>

    <!-- Clip Path for Typewriter Animation -->
    <clipPath id="typing-clip">
      <rect class="typing-mask" x="26" y="80" width="0" height="210" />
    </clipPath>
  </defs>

  <!-- Outer Window Background & Border -->
  <rect class="bg" x="1" y="1" width="998" height="308" />

  <!-- Soft Ambient Glow -->
  <rect class="ambient-glow" x="100" y="50" width="800" height="200" />

  <!-- CRT Scanlines -->
  <rect class="scanline-overlay" x="2" y="2" width="996" height="306" rx="15" />

  <!-- Top Bar -->
  <path class="header-bg" d="M 1,17 C 1,8 8,1 17,1 L 983,1 C 992,1 999,8 999,17 L 999,42 L 1,42 Z" />
  <line class="header-border" x1="1" y1="42" x2="999" y2="42" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text class="title" x="500" y="26">
    <tspan class="user">sharmaa-abhi@github</tspan>: ~$ <tspan class="cmd">./wordmark.sh --name</tspan>
  </text>

  <!-- Prompt Command Line -->
  <text class="prompt-text" x="26" y="70">
    <tspan class="prompt-user">sharmaa-abhi@github: ~$</tspan>
    <tspan class="prompt-cmd"> ./wordmark.sh --name</tspan>
  </text>

  <!-- ASCII Banner Content with Typewriter Mask -->
  <g clip-path="url(#typing-clip)">
    <text class="ascii-text" x="26" y="98">      SSSSSSSS       SSSSSSSSSSSS    SSS         SS  SSSSSSSSSSSSSSS   SSSSSSSSSSSSSS   SSS         SS  SSSSSSSSSSSSSSS  SSS         SSS </text>
    <text class="ascii-text" x="26" y="112">    :+++++++`        :SS++++++++`    ::`         :-` :+++++SSS+++++`   :+++++++++++`    ::`         :-` ::S+++++++++++`  :S`         -:+`</text>
    <text class="ascii-text" x="26" y="126">--`-+++++++--S`      :S`++++++++--S` ::`         :-` ++++++:S`+++++-  -S`++++++++++-    ::`         :-` ::`++++++++++-   :S`       --++- </text>
    <text class="ascii-text" x="26" y="140">:-``        :S`      :S`SSSSSSSS:+`  ::``SSSSSSS:-`        :S`        :S`               ::``SSSSSSS:-`  ::`SSSSSSS       :S`   SS+:+`    </text>
    <text class="ascii-text" x="26" y="154">:-`         :S`      :SS++++++++S`   ::SS++++++++S`        :S`        :+`               ::SS++++++++S`  ::S+++++++`      :S`   :+`       </text>
    <text class="ascii-text" x="26" y="168">:-`SSSSSSSS:S`       :S`++++++++-:S` ::`+++++++++-:`       :S`        ++-:SSSSSSS`      ::`+++++++++-:` ::`++++++++-     :S`SS`++-       </text>
    <text class="ascii-text" x="26" y="182">:-`+++++++++:S`      :S`         :S` ::`         :-`       :S`          :+++++++`SSS    ::`         :-` ::`              :S`++`SS        </text>
    <text class="ascii-text" x="26" y="196">:-`         :S`      :S`         :S` ::`         :-`       :S`                  :S`     ::`         :-` ::`              :S`  S:+`       </text>
    <text class="ascii-text" x="26" y="210">:-`         :S`      :S`         :S` ::`         :-`       :S`                  :S`     ::`         :-` ::`SSSSSSSSSSSS  :S`   ++-:``    </text>
    <text class="ascii-text" x="26" y="224">:-`         :S`      :S`SSSSSSSS:+`  ::`         :-` SSSSSS:S`SSSSSS  SSSSSSSSSS:S`     ::`         :-` ::+++++++++++++` :S`     +:+'SS  </text>
    <text class="ascii-text" x="26" y="238">:+`         :+`      :++++++++++`    :+`         :+` :+++++++++++++`  :+++++++++++`     :+`         :+`                  :+`        +:+` </text>
  </g>

  <!-- Animated Blinking Cursor at the end -->
  <rect class="cursor" x="945" y="225" width="9" height="15" rx="1" />
</svg>
