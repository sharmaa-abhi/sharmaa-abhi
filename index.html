<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Defender</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud" aria-label="Game HUD">
        <div class="hud-item">
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-item">
          <span class="label">Health</span>
          <strong id="health">100</strong>
        </div>
        <div class="hud-item">
          <span class="label">Level</span>
          <strong id="level">1</strong>
        </div>
      </header>

      <canvas id="gameCanvas" width="960" height="600" aria-label="Shooter game canvas"></canvas>

      <div class="overlay" id="overlay">
        <div class="panel">
          <p class="eyebrow">Arcade Defense</p>
          <h1>Star Defender</h1>
          <p class="subtitle">Hold the line against incoming raiders.</p>
          <ul>
            <li>Move: A/D or Arrow keys</li>
            <li>Shoot: Space or mouse click</li>
            <li>Restart: Enter after defeat</li>
          </ul>
          <button id="startButton" type="button">Start Mission</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
