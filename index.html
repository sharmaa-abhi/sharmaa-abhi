<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitSkins Wordmark Terminal - ABHISHEK SHARMA</title>
  <meta name="description" content="Pixel-perfect clone of GitSkins wordmark terminal component with text letter ASCII art for ABHISHEK SHARMA">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-wrapper">
    
    <!-- TERMINAL CONTAINER -->
    <div class="terminal-container" id="terminal-window">
      
      <!-- CRT & Glow Effects -->
      <div class="scanlines"></div>
      <div class="terminal-glow"></div>

      <!-- TOP BAR -->
      <div class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" title="Close"></span>
          <span class="dot dot-yellow" title="Minimize"></span>
          <span class="dot dot-green" title="Expand"></span>
        </div>
        <div class="terminal-title">
          <span class="username">sharmaa-abhi@github</span>: ~$ <span class="cmd" id="header-title-text">./wordmark.sh --name</span>
        </div>
        <div class="header-right">
          <span class="status-badge">zsh</span>
        </div>
      </div>

      <!-- MAIN TERMINAL BODY -->
      <div class="terminal-body">
        
        <!-- Command Prompt Line -->
        <div class="prompt-line">
          <span class="prompt-path">sharmaa-abhi@github: ~$</span>
          <span class="prompt-command" id="prompt-cmd-text">./wordmark.sh --name</span>
        </div>

        <!-- ASCII Banner Container -->
        <div class="ascii-wrapper">
          <pre class="ascii-banner" id="ascii-banner" aria-label="ABHISHEK SHARMA Text Letter Banner"></pre>
        </div>

      </div>
    </div>

    <!-- INTERACTIVE CONTROLS BAR -->
    <div class="controls-bar">
      <div class="control-group">
        <button class="btn btn-primary" id="btn-replay">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 1a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H5a.5.5 0 0 1 0-1h2.5V1.5A.5.5 0 0 1 8 1z"/>
          </svg>
          Replay Typing
        </button>

        <label for="variant-select" style="font-size: 0.8rem; color: var(--text-muted);">Font Style:</label>
        <select id="variant-select" class="style-selector">
          <option value="wordmark" selected>GitSkins Wordmark (S, :, +, -, ')</option>
          <option value="wordmarkFull">GitSkins Full ABHISHEK + SHARMA</option>
          <option value="block">ANSI Block Style</option>
        </select>
      </div>

      <div class="control-group">
        <button class="btn" id="btn-copy">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 1.5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1H4a1 1 0 0 1-1-1V1.5z"/>
            <path d="M5 0h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H5z"/>
          </svg>
          Copy Standalone SVG
        </button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
